<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <link rel="stylesheet" href="src/style.css" />
    <link href="https://fonts.cdnfonts.com/css/romantic" rel="stylesheet" />
    <link href="https://fonts.cdnfonts.com/css/winter" rel="stylesheet" />
    <title>AI Poem Generator</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Welcome to the AI French Poem Generator</h1>
      </header>
      <main>
        <form id="poem-generator-form">
          <input
            type="text"
            placeholder="Enter a topic for your poem"
            autofocus
            required
            autocomplete="off"
            class="instructions"
            id="user-instructions"
          />
          <input type="submit" class="submit-button" />
        </form>
        <div class="poem" id="poem"></div>
      </main>
      <br />
      <br />
      <br />
      <footer>
        Built by
        <a
          href="https://www.linkedin.com/in/christina-watson-751465386/"
          target="_blank"
          >Christina Watson</a
        >, open-sourced on
        <a
          href="https://github.com/depenhac-crypto/AI_Poem_Generator"
          target="_blank"
          >GitHub</a
        >
        and hosted on
        <a href="https://cw-ai-poem-generator.netlify.app/" target="_blank"
          >Netlify</a
        >.
      </footer>
    </div>
    <script src="src/index.js"></script>
  </body>
</html>
